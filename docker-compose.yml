services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: postgraduate_studies_db
      POSTGRES_USER: postgraduate_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment}
    volumes: [pgms_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgraduate_app -d postgraduate_studies_db"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    command: sh -c "python manage.py migrate && python manage.py seed_demo && python manage.py runserver 0.0.0.0:8000"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      POSTGRES_DB: postgraduate_studies_db
      POSTGRES_USER: postgraduate_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment}
      POSTGRES_HOST: db
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      PGMS_DEMO_PASSWORD: ${PGMS_DEMO_PASSWORD:?Set PGMS_DEMO_PASSWORD in your environment}
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
  web:
    build: ./web
    ports: ["5173:80"]
    depends_on: [backend]
volumes:
  pgms_data:

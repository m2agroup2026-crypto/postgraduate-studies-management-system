[project]
name = "assiut-medicine-postgraduate-system"
version = "0.1.0"
description = "Intranet postgraduate studies management system for Assiut University Faculty of Medicine"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "Django>=5.2.17,<5.3",
  "djangorestframework>=3.15,<4",
  "djangorestframework-simplejwt>=5.4,<6",
  "django-cors-headers>=4.7,<5",
  "gunicorn>=23,<24",
  "whitenoise>=6.9,<7",
  "psycopg[binary]>=3.2.9,<4",
  "pillow>=12.3.0",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "pytest-django>=4.11,<5",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "*_test.py"]
testpaths = ["tests", "apps"]
addopts = "--strict-markers --strict-config --disable-warnings -ra"

[tool.coverage.run]
branch = true
source = ["apps", "config"]
omit = [
  "*/migrations/*",
  "*/tests/*",
  "config/asgi.py",
  "config/wsgi.py",
  "config/settings/*",
]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "DJ", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"config/settings/*.py" = ["F403", "F405", "S105"]
"tests/*.py" = ["S101"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps", "config"]

name: Dashboard CI

on:
  pull_request:
    branches:
      - enterprise-development
    paths:
      - "backend/**"
      - "web/**"
      - ".github/workflows/dashboard-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install backend dependencies
        run: uv sync --group dev
      - name: Check migrations
        run: uv run python manage.py makemigrations --check --dry-run
      - name: Lint dashboard, students, theses, and committees modules
        run: >-
          uv run ruff check
          apps/core/api_views.py
          apps/core/models.py
          apps/core/services/workflow.py
          apps/core/workflow/policies.py
          apps/core/workflow/policy_checker.py
          apps/core/workflow/rules.py
          apps/core/tests/test_dashboard_configuration.py
          apps/students/api_views.py
          apps/students/api_urls.py
          apps/students/tests/test_students_api.py
          apps/theses/api_views.py
          apps/theses/api_urls.py
          apps/theses/tests/test_theses_api.py
          apps/committees/models.py
          apps/committees/api_views.py
          apps/committees/api_urls.py
          apps/committees/tests/test_committees_api.py
          config/urls.py
      - name: Run dashboard, students, theses, and committees tests
        run: >-
          uv run pytest
          apps/core/tests/test_dashboard_configuration.py
          apps/students/tests/test_students_api.py
          apps/theses/tests/test_theses_api.py
          apps/committees/tests/test_committees_api.py
          -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Build web dashboard
        run: npm run build
